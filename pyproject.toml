[project]
name = "marte"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "scipy>=1.11",
    "lifelines>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
llm = [
    "openai>=1.0",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"marte.prompts" = ["attack/*.txt", "attack/*.json", "target/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
